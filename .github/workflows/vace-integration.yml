name: VACE integration checks

on:
  push:
    branches:
      - feature/vace-video-to-video-custom-voice
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API and runner test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-vace-runner.txt httpx
      - name: Compile backend and runner
        run: python -m py_compile app.py vace_runner.py chatterbox_voice_worker.py
      - name: Test VACE API contracts and runner authentication
        env:
          STUDIO_ROOT: ${{ runner.temp }}/studio-vace-test
          ADMIN_PASSWORD_HASH: test-salt\$test-hash
          SESSION_SECRET: ci-session-secret
          VACE_RUNNER_TOKEN: ci-runner-secret
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
