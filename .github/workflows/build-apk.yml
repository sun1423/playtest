          int_helpers = """    private fun loadIntAsset(name: String, shape: LongArray): Tensor {
                  val bytes = context.assets.open(name).use { it.readBytes() }
                  val expected = shape.fold(1L) { total, dimension -> total * dimension }
                  require(bytes.size % 4 == 0 && bytes.size / 4L == expected) {
                      name + " byte length mismatch: expected " + (expected * 4) + ", got " + bytes.size
                  }
                  val buffer = ByteBuffer.wrap(bytes).order(ByteOrder.LITTLE_ENDIAN)
