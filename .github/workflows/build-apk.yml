name: QVAC Chatterbox Android Playtest (ARM64)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qvac-chatterbox-playtest-arm64
  cancel-in-progress: true

jobs:
  build:
    name: Build QVAC/GGML Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QVAC_COMMIT: 12ae8b2f98b2a5d6713fe44cc91b0ae4027def3c
      GGML_COMMIT: 6fe02a1b03958dc882fb1c115a150abec4e3e379
      PLAYTEST_KEYSTORE_PASSWORD: ${{ secrets.PLAYTEST_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout Playtest app source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Reuse native CMake objects and pinned third-party source between commits.
      # The restore prefix lets a new app commit inherit the previous build cache.
      - name: Restore Android native build cache
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build
            third_party/qvac-fabric-speech.cpp
          key: qvac-arm64-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            qvac-arm64-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Skip the deprecated SDK "tools" package. Required SDK components
          # are installed explicitly in the next step.
          packages: ''

      - name: Install Android NDK, CMake and Vulkan shader compiler
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v glslc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y glslc
          fi
          (yes || true) | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.31.0"

      - name: Fetch pinned QVAC Chatterbox source and matching GGML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party
          QVAC_DIR="third_party/qvac-fabric-speech.cpp"
          if [[ ! -d "$QVAC_DIR/.git" ]]; then
            git clone --filter=blob:none https://github.com/tetherto/qvac-fabric-speech.cpp.git "$QVAC_DIR"
          fi
          git -C "$QVAC_DIR" checkout --detach "$QVAC_COMMIT"
          git -C "$QVAC_DIR" reset --hard "$QVAC_COMMIT"
          GGML_DIR="$QVAC_DIR/engines/tts/ggml"
          if [[ ! -d "$GGML_DIR/.git" ]]; then
            rm -rf "$GGML_DIR"
            git clone --filter=blob:none https://github.com/tetherto/qvac-ext-ggml.git "$GGML_DIR"
          fi
          git -C "$GGML_DIR" checkout --detach "$GGML_COMMIT"
          git -C "$GGML_DIR" reset --hard "$GGML_COMMIT"
          echo "QVAC source: $(git -C third_party/qvac-fabric-speech.cpp rev-parse HEAD)"
          echo "GGML source: $(git -C "$GGML_DIR" rev-parse HEAD)"

          # Apply the pinned, reviewed Android low-memory changes after checkout.
          if git -C "$QVAC_DIR" apply --check "$GITHUB_WORKSPACE/patches/qvac-chatterbox-low-memory.patch"; then
            git -C "$QVAC_DIR" apply "$GITHUB_WORKSPACE/patches/qvac-chatterbox-low-memory.patch"
          elif ! git -C "$QVAC_DIR" apply --reverse --check "$GITHUB_WORKSPACE/patches/qvac-chatterbox-low-memory.patch"; then
            echo "::error::Cached QVAC source is neither clean nor patched with the expected low-memory patch."
            exit 1
          fi
          git -C "$QVAC_DIR" diff --check
          grep -q "bool low_memory = false;" third_party/qvac-fabric-speech.cpp/engines/tts/include/tts-cpp/chatterbox/fit.h
          grep -q "TTS_CPP_CHATTERBOX_LOW_MEMORY" third_party/qvac-fabric-speech.cpp/engines/tts/src/chatterbox_tts.cpp

      - name: Prepare persistent Playtest signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAYTEST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAYTEST_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" || -z "${KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::Add PLAYTEST_KEYSTORE_BASE64 and PLAYTEST_KEYSTORE_PASSWORD as repository Actions secrets."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/playtest-signing.p12"
          export KEYSTORE_PATH
          python3 - <<'PY'
          import base64
          import binascii
          import os
          import re
          import sys

          raw = os.environ.get("KEYSTORE_BASE64", "")
          compact = "".join(raw.split())

          if not compact:
              sys.exit("::error::PLAYTEST_KEYSTORE_BASE64 is empty.")
          invalid = re.search(r"[^A-Za-z0-9+/=]", compact)
          if invalid:
              sys.exit(
                  "::error::PLAYTEST_KEYSTORE_BASE64 contains an invalid character "
                  f"at position {invalid.start() + 1} (character code {ord(invalid.group())}). "
                  "Replace the secret using the original Base64 file; do not paste terminal prompts."
              )
          if len(compact) % 4 != 0:
              sys.exit(
                  "::error::PLAYTEST_KEYSTORE_BASE64 length is not a multiple of 4. "
                  "The secret is likely truncated; copy the complete one-line file again."
              )
          try:
              decoded = base64.b64decode(compact, validate=True)
          except (binascii.Error, ValueError) as exc:
              sys.exit(f"::error::PLAYTEST_KEYSTORE_BASE64 padding/encoding is invalid: {exc}")
          if not decoded:
              sys.exit("::error::Decoded signing keystore is empty.")
          if base64.b64encode(decoded).decode("ascii") != compact:
              sys.exit("::error::PLAYTEST_KEYSTORE_BASE64 is not canonical Base64.")
          with open(os.environ["KEYSTORE_PATH"], "wb") as output:
              output.write(decoded)
          print(f"Decoded signing keystore successfully ({len(decoded)} bytes).")
          PY

          keytool -list -storetype PKCS12 -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" -alias playtest >/dev/null
          echo "PLAYTEST_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build ARM64 optimized release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --parallel --max-workers=2 assembleRelease

      - name: Verify APK ABI and native QVAC library
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::APK output is missing."
            exit 1
          fi
          python3 - "$APK" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
          abis = sorted({
              name.split("/")[1]
              for name in names
              if name.startswith("lib/") and name.count("/") >= 2
          })
          if abis != ["arm64-v8a"]:
              raise SystemExit("Expected an ARM64-only APK; found: " + repr(abis))
          required = "lib/arm64-v8a/libqvac_tts_jni.so"
          if required not in names:
              raise SystemExit("QVAC JNI runtime is missing from the APK.")
          print("APK contains the QVAC JNI runtime and ARM64-only native libraries.")
          PY
          mkdir -p output
          cp "$APK" output/QVAC-Chatterbox-Playtest-arm64-v8a.apk
          {
            echo "## QVAC Chatterbox Android Playtest"
            echo "- Runtime: QVAC Fabric Speech C++ / GGML"
            echo "- Models: user-imported T3 + S3Gen GGUF (not bundled)"
            echo "- Voice: Azure QVAC five-tensor NumPy profile (user-imported)"
            echo "- Context: 320; F16 KV cache; low-memory sequential S3Gen stage-cache release"
            echo "- Adaptive speech-token budget (80–48); 2–4 CPU threads; 768 MiB QVAC margin plus 128/256 MiB RAM-tiered extra headroom"
            echo "- Backend: Vulkan when available, QVAC CPU fallback"
            echo "- ABI: arm64-v8a"
            echo "- Build: optimized Release variant; no test suites or emulator jobs are run by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="qvac-playtest-${GITHUB_RUN_ID}"
          APK="output/QVAC-Chatterbox-Playtest-arm64-v8a.apk"
          test -s "$APK"

          # GitHub Actions artifacts are always packaged as ZIP archives.
          # Publish the APK as a GitHub Release asset so it downloads as a
          # standalone .apk file without an artifact ZIP wrapper.
          gh release create "$TAG" "$APK#QVAC-Chatterbox-Playtest-arm64-v8a.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "QVAC Chatterbox Playtest ${GITHUB_RUN_NUMBER}" \
            --notes "Manual ARM64 Android playtest build from commit ${GITHUB_SHA}. Models and voice profile are imported separately in the app." \
            --prerelease

          echo "Direct APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/QVAC-Chatterbox-Playtest-arm64-v8a.apk" >> "$GITHUB_STEP_SUMMARY"
