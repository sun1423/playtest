          grep -q 'Tensor.fromBlob(intArrayOf(step)' app/src/main/java/com/acul3/chatterboxtts/models/T3Decoder.kt
          grep -q 'loadIntAsset("prompt_tokens.bin"' app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt
          grep -q 'loadIntAsset("prompt_token_len.bin"' app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt
          grep -q 'speechToksPadded = IntArray' app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt
          grep -q 'intArrayOf(nTokens)' app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt
          grep -q 'tensorScalarToInt(hLenTensor' app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt
          grep -q 'tensorScalarToInt(melLen1Tensor' app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt
          grep -q 'T3 prefill requires FP32 cond_emb' app/src/main/java/com/acul3/chatterboxtts/models/T3Decoder.kt
          grep -q 'T3 prefill requires INT32 text_tokens' app/src/main/java/com/acul3/chatterboxtts/models/T3Decoder.kt
          grep -q 'Tensor.fromBlob(intArrayOf(token)' app/src/main/java/com/acul3/chatterboxtts/models/T3Decoder.kt
          grep -q 'Tensor.fromBlob(intArrayOf(step)' app/src/main/java/com/acul3/chatterboxtts/models/T3Decoder.kt
          grep -q 'loadIntAsset("prompt_tokens.bin"' app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt
          grep -q 'loadIntAsset("prompt_token_len.bin"' app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt
          grep -q 'speechToksPadded = IntArray' app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt
          ! grep -q 'T3 text tokens must be INT64' app/src/main/java/com/acul3/chatterboxtts/models/T3Decoder.kt
          ! grep -q 'LongArray(Constants.TEXT_SEQ_LEN)' app/src/main/java/com/acul3/chatterboxtts/tts/ChatterboxTTS.kt
          ! grep -q 'LongArray(Constants.MAX_SPEECH_TOKENS_VOCODER)' app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt
          ! grep -q 'T3 text tokens must be INT64' app/src/main/java/com/acul3/chatterboxtts/models/T3Decoder.kt
          ! grep -q 'PTE T3 exports use FP16' app/src/main/java/com/acul3/chatterboxtts/models/T3Decoder.kt
          ! grep -q 'loadLongAsset("prompt_tokens.bin"' app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt
          ! grep -q 'loadLongAsset("prompt_token_len.bin"' app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt
          ! grep -q 'val textSeq = LongArray(Constants.TEXT_SEQ_LEN)' app/src/main/java/com/acul3/chatterboxtts/tts/ChatterboxTTS.kt
          ! grep -q 'speechToksPadded = LongArray' app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt

      - name: Prepare permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAYTEST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAYTEST_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" || -z "${KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::Add PLAYTEST_KEYSTORE_BASE64 and PLAYTEST_KEYSTORE_PASSWORD in Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/playtest-signing.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -storetype PKCS12 -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" -alias playtest >/dev/null
          echo "PLAYTEST_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: /tmp/chatterbox-android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify APK is ARM64-only
        working-directory: /tmp/chatterbox-android
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ABIS="$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" {print $2}' | sort -u)"
          echo "Native APK ABIs:"
          printf '%s\n' "$ABIS"
          test "$ABIS" = "arm64-v8a"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Chatterbox-Playtest-v2-arm64-v8a.apk"
          {
            echo "## Chatterbox Playtest APK"
            echo "- **ABI:** arm64-v8a only"
            echo "- **Package:** com.sun1423.playtest.v2"
            echo "- **Upstream source commit:** $UPSTREAM_COMMIT"
            echo "- **Pinned model revision:** $MODEL_REVISION"
            echo "- **PTE cache:** exact byte count and SHA-256 checked"
            echo "- **Hindi:** enabled with the model's supported language list"
            echo "- **Voice profile:** import a ZIP of precomputed conditioning tensors"
            echo "- **Model files:** downloaded by the app on first generation; several GB required"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK pending full PTE validation
        uses: actions/upload-artifact@v4
        with:
          name: playtest-arm64-apk
          path: output/Chatterbox-Playtest-v2-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 3

  validate-pte-e2e:
    name: Validate all seven PTE models and generate real WAV
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-pte-e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      MODEL_REVISION: ${{ needs.build.outputs.model_revision }}
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU PyTorch and ExecuTorch 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0 torchaudio==2.10.0
          python -m pip install executorch==1.1.0

      - name: Install Chatterbox inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "numpy>=2.0,<2.3" \
            librosa==0.11.0 \
            s3tokenizer \
            transformers==5.2.0 \
            diffusers==0.29.0 \
            git+https://github.com/resemble-ai/Perth.git@master \
            conformer==0.3.2 \
            safetensors==0.5.3 \
            spacy-pkuseg \
            pykakasi==2.3.0 \
            pyloudnorm \
            omegaconf \
            soundfile \
            huggingface_hub

      - name: Fetch pinned upstream reference test
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/acul3/chatterbox-executorch.git /tmp/chatterbox-executorch
          git -C /tmp/chatterbox-executorch checkout --detach 4241137d8150fe96eb0d4ebf8a228e9abd072ab9
          python -m pip install --no-deps -e /tmp/chatterbox-executorch
          echo "Reference repository commit: $(git -C /tmp/chatterbox-executorch rev-parse HEAD)"

      - name: Cache pinned PTE models
        uses: actions/cache@v4
        with:
          path: /tmp/chatterbox-executorch/et_models
          key: chatterbox-pte-${{ env.MODEL_REVISION }}

      - name: Download the exact seven PTE models used by the APK
        working-directory: /tmp/chatterbox-executorch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODEL_REVISION"
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download

          revision = os.environ["MODEL_REVISION"]
          files = [
              "t3_cond_speech_emb.pte",
              "t3_cond_enc.pte",
              "t3_prefill.pte",
              "t3_decode.pte",
              "s3gen_encoder.pte",
              "cfm_step.pte",
              "hifigan.pte",
          ]
          root = Path(snapshot_download(
              repo_id="acul3/chatterbox-executorch",
              repo_type="model",
              revision=revision,
              local_dir="et_models",
              allow_patterns=files,
          ))
          total = 0
          for name in files:
              item = root / name
              if not item.is_file() or item.stat().st_size <= 1024:
                  raise SystemExit(f"Missing or incomplete PTE: {name}")
              total += item.stat().st_size
              print(f"READY {name}: {item.stat().st_size:,} bytes")
          print(f"Seven PTE files downloaded from revision {revision}: {total:,} bytes")
          PY

      - name: Correct reference-test indexing and require real speech tokens
        working-directory: /tmp/chatterbox-executorch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("test_true_full_pte.py")
          source = path.read_text()

          # Current pinned PTE files are 2.1 GB T3 modules and report FP32 input contracts.
          for model_line in [
              'prefill_pte = PTE("t3_prefill", fp16=True)',
              'decode_pte = PTE("t3_decode", fp16=True)',
          ]:
              if source.count(model_line) != 1:
                  raise SystemExit("Expected exactly one T3 model precision declaration: " + model_line)
              source = source.replace(model_line, model_line.replace("fp16=True", "fp16=False"))

          # T3 prefill's exported signature is FP32 cond_emb + INT32 text_tokens.
          old_text = "text_tokens = torch.tensor([[SOT_TEXT] + padded + [EOT_TEXT]], dtype=torch.long)"
          if source.count(old_text) != 1:
              raise SystemExit("Expected exactly one T3 prefill text tensor construction")
          source = source.replace(
              old_text,
              "text_tokens = torch.tensor([[SOT_TEXT] + padded + [EOT_TEXT]], dtype=torch.int32)",
          )

          old_step = "step_idx = torch.tensor(step + 1, dtype=torch.long)"
          if source.count(old_step) != 1:
              raise SystemExit("Expected exactly one V4 decode-step expression")
          # Match Android loadIntAsset(): t3_cond_speech_emb expects INT32 token IDs.
          old_cond = "cond_speech_emb = cond_speech_emb_pte(cond_tokens)[0]"
          if source.count(old_cond) != 1:
              raise SystemExit("Expected exactly one conditioning PTE call")
          source = source.replace(
              old_cond,
              "cond_tokens = cond_tokens.to(torch.int32)  # Android Tensor.fromBlob(IntArray) -> INT32" + chr(10) +
              old_cond,
          )

          source = source.replace(
              old_step,
              "step_idx = torch.tensor(step, dtype=torch.int32)",
          )

          old_prev = "prev_token = torch.tensor([[tok]], dtype=torch.long)"
          if source.count(old_prev) != 1:
              raise SystemExit("Expected exactly one V4 previous-token tensor")
          source = source.replace(
              old_prev,
              "prev_token = torch.tensor([[tok]], dtype=torch.int32)",
          )

          # S3Gen's token embedding input is INT32 in the actual PTE runtime contract.
          old_speech_tokens = "speech_toks_padded = torch.zeros(1, MAX_SPEECH_TOKENS, dtype=torch.long)"
          if source.count(old_speech_tokens) != 1:
              raise SystemExit("Expected exactly one S3Gen speech-token buffer")
          source = source.replace(
              old_speech_tokens,
              "speech_toks_padded = torch.zeros(1, MAX_SPEECH_TOKENS, dtype=torch.int32)",
          )

          old_speech_len = "speech_tok_len = torch.tensor([n_tokens], dtype=torch.long)"
          if source.count(old_speech_len) != 1:
              raise SystemExit("Expected exactly one S3Gen speech-token length tensor")
          source = source.replace(
              old_speech_len,
              "speech_tok_len = torch.tensor([n_tokens], dtype=torch.int32)",
          )

          old_prompt_tokens = 'prompt_tokens_raw = conds.gen["prompt_token"].cpu().long()'
          if source.count(old_prompt_tokens) != 1:
              raise SystemExit("Expected exactly one S3Gen prompt-token tensor")
          source = source.replace(
              old_prompt_tokens,
              'prompt_tokens_raw = conds.gen["prompt_token"].cpu().to(torch.int32)',
          )

          old_prompt_len = "prompt_tok_len = torch.tensor([min(conds.gen[\"prompt_token_len\"].item(), PROMPT_LEN)], dtype=torch.long)"
          if source.count(old_prompt_len) != 1:
              raise SystemExit("Expected exactly one S3Gen prompt-token length tensor")
          source = source.replace(
              old_prompt_len,
              "prompt_tok_len = torch.tensor([min(conds.gen[\"prompt_token_len\"].item(), PROMPT_LEN)], dtype=torch.int32)",
          )


          source = source.replace("MAX_GEN = 200", "MAX_GEN = 16")
          old_fallback = """if n_tokens == 0:
              print("   ❌ No tokens generated! Using dummy tokens for vocoder test.")
              speech_tokens = list(range(100, 150))  # dummy
              n_tokens = len(speech_tokens)"""
          if source.count(old_fallback) != 1:
              raise SystemExit("Reference dummy-token fallback not found exactly once")
          source = source.replace(
              old_fallback,
              """if n_tokens == 0:
              raise RuntimeError("T3 generated zero speech tokens; refusing a dummy-token vocoder pass.")""",
          )
          path.write_text(source)
          print("Patched V4 step index to zero-based; limited test to 64 tokens; disabled dummy-token fallback.")
          PY

      - name: Run full PTE pipeline and validate WAV
        working-directory: /tmp/chatterbox-executorch
        shell: bash
        run: |
          set -euo pipefail
          python -u test_true_full_pte.py 2>&1 | tee /tmp/pte-e2e.log
          python - <<'PY'
          import math
          import soundfile as sf
          from pathlib import Path

          wav = Path("e2e_outputs/true_full_pte/en_TRUE_FULL_PTE.wav")
          if not wav.is_file() or wav.stat().st_size < 1024:
              raise SystemExit("E2E test did not produce a usable WAV file")
          info = sf.info(wav)
          audio, sample_rate = sf.read(wav, dtype="float32")
          if sample_rate != 24000:
              raise SystemExit(f"Unexpected sample rate: {sample_rate}")
          if info.frames < 4800:
              raise SystemExit(f"Audio is too short to count as a valid test: {info.frames} frames")
          if not all(math.isfinite(float(x)) for x in audio.reshape(-1)[::max(1, len(audio.reshape(-1)) // 10000)]):
              raise SystemExit("WAV contains NaN or infinite samples")
          peak = float(abs(audio).max())
          if peak < 1e-5:
              raise SystemExit("WAV is silent")
          print(
              f"VALID WAV: {info.duration:.2f}s, {sample_rate} Hz, "
              f"{info.channels} channel(s), peak={peak:.5f}, bytes={wav.stat().st_size}"
          )
          PY

      - name: Upload PTE validation log and sample WAV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatterbox-full-pte-validation
          path: |
            /tmp/pte-e2e.log
            /tmp/chatterbox-executorch/e2e_outputs/true_full_pte/en_TRUE_FULL_PTE.wav
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish direct APK only after PTE validation
    needs: [build, validate-pte-e2e]
    if: always() && needs.build.result == 'success' && needs.build.outputs.model_revision == 'e444904352a22332a8083d6fb7b9354ee5e96daf' && (needs['validate-pte-e2e'].result == 'success' || needs['validate-pte-e2e'].result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: playtest-arm64-apk
          path: output

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s output/Chatterbox-Playtest-v2-arm64-v8a.apk
          TAG="playtest-v2-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            output/Chatterbox-Playtest-v2-arm64-v8a.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Chatterbox Playtest 2 - ARM64 APK (E2E verified)" \
            --notes "Direct APK download. Package: com.sun1423.playtest.v2. ABI: arm64-v8a only. Model revision: ${{ needs.build.outputs.model_revision }}. Full 7-PTE audio generation test produced and validated a non-silent 24 kHz WAV. Signed with the persistent Playtest v2 key." \
            --prerelease
