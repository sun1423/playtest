name: Chatterbox Playtest - ARM64 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playtest-arm64
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64-v8a debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      model_revision: ${{ steps.generate.outputs.model_revision }}
    env:
      UPSTREAM_COMMIT: 7613d13ccfeb5d90babb1b14c0d8cf2da2d70f63
      ANDROID_PROJECT_DIR: /tmp/chatterbox-android
      PLAYTEST_KEYSTORE_PASSWORD: ${{ secrets.PLAYTEST_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned Chatterbox Android implementation
        shell: bash
        run: |
          git clone https://github.com/acul3/chatterbox-tts-android.git "$ANDROID_PROJECT_DIR"
          git -C "$ANDROID_PROJECT_DIR" checkout --detach "$UPSTREAM_COMMIT"
          echo "Using upstream commit: $(git -C "$ANDROID_PROJECT_DIR" rev-parse HEAD)"

      - name: Generate Playtest changes from this workflow
        id: generate
        shell: bash
        run: |
          cd "$ANDROID_PROJECT_DIR"

          MODEL_REVISION="e444904352a22332a8083d6fb7b9354ee5e96daf"
          MODEL_INFO="$(curl --fail --location --retry 3 --silent --show-error \
            "https://huggingface.co/api/models/acul3/chatterbox-executorch/revision/$MODEL_REVISION?blobs=true")"
          if ! [[ "$MODEL_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Hugging Face did not return a valid immutable model revision."
            exit 1
          fi
          MODEL_MANIFEST_B64="$(python3 -c '
          import base64, json, re, sys
          data=json.load(sys.stdin)
          required=["t3_cond_speech_emb.pte","t3_cond_enc.pte","t3_prefill.pte","t3_decode.pte","s3gen_encoder.pte","cfm_step.pte","hifigan.pte"]
          siblings={item.get("rfilename"): item for item in data.get("siblings",[])}
          manifest={}
          for name in required:
              item=siblings.get(name)
              if item is None:
                  raise SystemExit("Missing PTE in model repository: "+name)
              lfs=item.get("lfs") or {}
              sha=lfs.get("sha256") or item.get("sha256") or ""
              if not sha and lfs.get("oid"):
                  sha=lfs["oid"].split(":")[-1]
              size=lfs.get("size") or item.get("size")
              if not re.fullmatch(r"[0-9a-f]{64}", str(sha)):
                  raise SystemExit("No valid SHA-256 metadata for "+name)
              if not isinstance(size,int) or size <= 1024:
                  raise SystemExit("No valid file size metadata for "+name)
              manifest[name]={"sha256":sha,"size":size}
          print(base64.b64encode(json.dumps(manifest,sort_keys=True).encode()).decode())
          ' <<< "$MODEL_INFO")"
          export MODEL_REVISION MODEL_MANIFEST_B64
          echo "MODEL_REVISION=$MODEL_REVISION" >> "$GITHUB_ENV"
          echo "MODEL_MANIFEST_B64=$MODEL_MANIFEST_B64" >> "$GITHUB_ENV"
          echo "Pinning seven PTE models to immutable revision $MODEL_REVISION with SHA-256 metadata"
          echo "model_revision=$MODEL_REVISION" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import os
          import json
          import base64

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # Give this app its own package id and restrict native code to ARM64.
          gradle = Path("app/build.gradle.kts")
          text = gradle.read_text()
          text = replace_once(
              text,
              'applicationId = "com.acul3.chatterboxtts"',
              'applicationId = "com.sun1423.playtest.v2"',
              "applicationId"
          )
          text = replace_once(
              text,
              'abiFilters += listOf("arm64-v8a", "x86_64")',
              'abiFilters += listOf("arm64-v8a")',
              "ABI filter"
          )
          gradle.write_text(text)

          # Increment versionCode on every Actions run so signed builds can update an installed v2 app.
          text = gradle.read_text()
          text = replace_once(
              text,
              "        versionCode = 1",
              '        versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()',
              "automatic Android versionCode"
          )
          text = replace_once(
              text,
              '        versionName = "1.0"',
              '        versionName = "2.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "1")',
              "automatic Android versionName"
          )
          gradle.write_text(text)

          # Use the same private PKCS12 key for every Playtest v2 build.
          text = gradle.read_text()
          text = replace_once(
              text,
              "    buildTypes {\n        release {",
              """    signingConfigs {
                  create("playtest") {
                      storeFile = file(System.getenv("PLAYTEST_KEYSTORE_PATH"))
                      storePassword = System.getenv("PLAYTEST_KEYSTORE_PASSWORD")
                      keyAlias = "playtest"
                      keyPassword = System.getenv("PLAYTEST_KEYSTORE_PASSWORD")
                      storeType = "PKCS12"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig = signingConfigs.getByName("playtest")
                  }
                  release {""",
              "persistent debug signing config"
          )
          gradle.write_text(text)

          # Match the Android runtime to the ExecuTorch version used to export
          # the Chatterbox PTE model files (see model repository Android guide).
          version_catalog = Path("gradle/libs.versions.toml")
          text = version_catalog.read_text()
          text = replace_once(
              text,
              'executorch = "0.6.0"',
              'executorch = "1.1.0"',
              "ExecuTorch runtime/model version"
          )
          version_catalog.write_text(text)

          # Pin model downloads to the immutable Hugging Face snapshot used by this build.
          model_revision = os.environ.get("MODEL_REVISION", "")
          if not re.fullmatch(r"[0-9a-f]{40}", model_revision):
              raise SystemExit("MODEL_REVISION is missing or invalid")
          constants = Path("app/src/main/java/com/acul3/chatterboxtts/tts/Constants.kt")
          text = constants.read_text()
          text = replace_once(
              text,
              "object Constants {",
              "object Constants {" + chr(10) + "    const val TEXT_VOCAB = 2454",
              "T3 multilingual text vocabulary size"
          )
          text = replace_once(
              text,
              '    const val HF_REPO_BASE = "https://huggingface.co/acul3/chatterbox-executorch/resolve/main"',
              '    const val MODEL_REVISION = "' + model_revision + '"' + chr(10) +
              '    const val HF_REPO_BASE = "https://huggingface.co/acul3/chatterbox-executorch/resolve/' + model_revision + '"',
              "immutable model revision"
          )
          constants.write_text(text)

          # Embed the immutable revision's exact file sizes and SHA-256 digests.
          manifest = json.loads(base64.b64decode(os.environ["MODEL_MANIFEST_B64"]).decode("utf-8"))
          expected_models = {
              "t3_cond_speech_emb.pte", "t3_cond_enc.pte", "t3_prefill.pte",
              "t3_decode.pte", "s3gen_encoder.pte", "cfm_step.pte", "hifigan.pte"
          }
          if set(manifest) != expected_models:
              raise SystemExit("Pinned model manifest is incomplete or contains unexpected files")
          constants = Path("app/src/main/java/com/acul3/chatterboxtts/tts/Constants.kt")
          text = constants.read_text()
          names = sorted(expected_models)
          lines = ["    val MODEL_SHA256: Map<String, String> = mapOf("]
          lines += [
              '        "' + name + '" to "' + manifest[name]["sha256"] + '"' +
              ("," if index < len(names) - 1 else "")
              for index, name in enumerate(names)
          ]
          lines += ["    )", "    val MODEL_SIZES: Map<String, Long> = mapOf("]
          lines += [
              '        "' + name + '" to ' + str(manifest[name]["size"]) + "L" +
              ("," if index < len(names) - 1 else "")
              for index, name in enumerate(names)
          ]
          lines += ["    )"]
          text = replace_once(
              text,
              "    val MODEL_FILES = listOf(",
              chr(10).join(lines) + chr(10) + chr(10) + "    val MODEL_FILES = listOf(",
              "model SHA-256/size manifest"
          )
          constants.write_text(text)

          Path("app/src/main/res/values/strings.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <string name="app_name">Chatterbox Playtest 2</string>\n'
              '</resources>\n'
          )

          # Match the actual 23-language Chatterbox Multilingual model.
          screen = Path("app/src/main/java/com/acul3/chatterboxtts/ui/MainScreen.kt")
          text = screen.read_text()
          languages = '''    val languages = listOf(
                  "ar" to "Arabic",
                  "da" to "Danish",
                  "de" to "German",
                  "el" to "Greek",
                  "en" to "English",
                  "es" to "Spanish",
                  "fi" to "Finnish",
                  "fr" to "French",
                  "he" to "Hebrew",
                  "hi" to "Hindi",
                  "it" to "Italian",
                  "ja" to "Japanese",
                  "ko" to "Korean",
                  "ms" to "Malay",
                  "nl" to "Dutch",
                  "no" to "Norwegian",
                  "pl" to "Polish",
                  "pt" to "Portuguese",
                  "ru" to "Russian",
                  "sv" to "Swedish",
                  "sw" to "Swahili",
                  "tr" to "Turkish",
                  "zh" to "Chinese"
              )'''
          text, count = re.subn(
              r'    val languages = listOf\([\s\S]*?\n    \)',
              languages,
              text,
              count=1
          )
          if count != 1:
              raise SystemExit("Could not replace Android language selector")

          text = replace_once(
              text,
              'import android.widget.Toast',
              'import android.widget.Toast\n'
              'import androidx.activity.compose.rememberLauncherForActivityResult\n'
              'import androidx.activity.result.contract.ActivityResultContracts',
              "MainScreen imports"
          )
          text = replace_once(
              text,
              '    val scope = rememberCoroutineScope()',
              '''    val scope = rememberCoroutineScope()
              val profilePicker = rememberLauncherForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  if (uri != null) {
                      scope.launch { viewModel.importVoiceProfile(context, uri) }
                  }
              }''',
              "profile picker"
          )
          profile_ui = '''            // Import a precomputed Chatterbox voice profile.
                      OutlinedButton(
                          onClick = {
                              profilePicker.launch(arrayOf("application/zip", "application/octet-stream"))
                          },
                          modifier = Modifier.fillMaxWidth(),
                          enabled = !state.isGenerating
                      ) {
                          Text("Import voice profile ZIP")
                      }
                      OutlinedButton(
                          onClick = { viewModel.useDefaultVoice(context) },
                          modifier = Modifier.fillMaxWidth(),
                          enabled = !state.isGenerating
                      ) {
                          Text("Use bundled default voice")
                      }
                      Text(
                          text = state.voiceProfileStatus,
                          style = MaterialTheme.typography.bodyMedium,
                          fontWeight = FontWeight.SemiBold
                      )
                      Text(
                          text = "ZIP needs speaker_emb.bin (1,024), cond_speech_tokens.bin (600), prompt_tokens.bin (300), prompt_token_len.bin (4), xvector.bin (768), and prompt_mel.bin (100,480 bytes). emotion_adv.bin (4) is optional. Use precomputed profile tensors; raw WAV import is not supported.",
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant
                      )

                      // Language selector'''
          text = replace_once(text, '            // Language selector', profile_ui, "profile UI")
          screen.write_text(text)

          # Prefer the imported tensors over the bundled default-voice assets.
          engine = Path("app/src/main/java/com/acul3/chatterboxtts/tts/ChatterboxTTS.kt")
          text = engine.read_text()
          text = replace_once(
              text,
              'import java.nio.ByteOrder',
              'import java.nio.ByteOrder\nimport java.io.File',
              "ChatterboxTTS imports"
          )
          helper = '''    private fun readConditioningBytes(name: String): ByteArray {
                  val custom = File(context.filesDir, "voice-profile/$name")
                  return if (custom.isFile) {
                      custom.readBytes()
                  } else {
                      context.assets.open(name).use { it.readBytes() }
                  }
              }

              // ── Asset loading helpers ─────────────────────────────────────────────────'''
          text = replace_once(
              text,
              '    // ── Asset loading helpers ─────────────────────────────────────────────────',
              helper,
              "conditioning file helper"
          )
          text = text.replace(
              'val bytes = context.assets.open(name).readBytes()',
              'val bytes = readConditioningBytes(name)'
          )
          if text.count('val bytes = readConditioningBytes(name)') != 2:
              raise SystemExit("Conditioning loader patch did not update both tensor readers")
          engine.write_text(text)

          # Apply the same selected profile to the S3Gen/vocoder conditioning inputs.
          vocoder = Path("app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt")
          text = vocoder.read_text()
          text = replace_once(
              text,
              'import java.nio.ByteOrder',
              'import java.nio.ByteOrder' + chr(10) + 'import java.io.File',
              "VocoderPipeline imports"
          )
          text = replace_once(
              text,
              '    private val promptMel: Tensor by lazy { loadFloatAsset("prompt_mel.bin", longArrayOf(1, 314, 80)) }',
              '''    private val promptMel: Tensor by lazy { loadFloatAsset("prompt_mel.bin", longArrayOf(1, 314, 80)) }

              private fun conditioningBytes(name: String): ByteArray {
                  val custom = File(context.filesDir, "voice-profile/$name")
                  return if (custom.isFile) custom.readBytes()
                  else context.assets.open(name).use { it.readBytes() }
              }''',
              "vocoder profile reader"
          )
          old_asset_read = '        val bytes = context.assets.open(name).readBytes()'
          if text.count(old_asset_read) != 2:
              raise SystemExit("Expected two vocoder conditioning asset readers")
          text = text.replace(old_asset_read, '        val bytes = conditioningBytes(name)')
          # Existing bundled prompt token assets are INT32, but the model input is INT64.
          text = replace_once(
              text,
              '''        val longs = LongArray(bytes.size / 8)
                  buffer.asLongBuffer().get(longs)
                  return Tensor.fromBlob(longs, shape)''',
              '''        val elementCount = shape.fold(1L) { total, dimension -> total * dimension }.toInt()
                  val longs = when (bytes.size) {
                      elementCount * 8 -> LongArray(elementCount).also { buffer.asLongBuffer().get(it) }
                      elementCount * 4 -> IntArray(elementCount).also { buffer.asIntBuffer().get(it) }
                          .map { it.toLong() }.toLongArray()
                      else -> throw IllegalArgumentException(
                          "$name has an invalid byte length: ${bytes.size}"
                      )
                  }
                  return Tensor.fromBlob(longs, shape)''',
              "vocoder int32/int64 loader"
          )
          vocoder.write_text(text)

          # Tokenizer returns content tokens. ChatterboxTTS adds SOT/EOT once.
          tokenizer = Path("app/src/main/java/com/acul3/chatterboxtts/tts/TextTokenizer.kt")
          text = tokenizer.read_text()
          text = replace_once(
              text,
              '        // Add SOT\n        tokens.add(Constants.SOT_TEXT)\n\n',
              '        // SOT and EOT are added by ChatterboxTTS around the fixed input sequence.\n',
              "tokenizer start marker"
          )
          text = replace_once(
              text,
              '        // Add EOT\n        tokens.add(Constants.EOT_TEXT)\n\n',
              '',
              "tokenizer end marker"
          )
          old_truncation = '''        // Truncate to max length
                  val result = if (tokens.size > Constants.MAX_TEXT_LEN) {
                      tokens.subList(0, Constants.MAX_TEXT_LEN - 1).toMutableList().also {
                          it.add(Constants.EOT_TEXT)
                      }
                  } else {
                      tokens
                  }

                  return result.toIntArray()'''
          new_truncation = '''        // Keep content tokens only; ChatterboxTTS adds the fixed SOT/EOT markers.
                  return tokens.take(Constants.MAX_TEXT_LEN).toIntArray()'''
          # Match the actual indentation in the Kotlin source independently of this script's indentation.
          pattern = (
              r'        // Truncate to max length\n'
              r'        val result = if \(tokens\.size > Constants\.MAX_TEXT_LEN\) \{\n'
              r'            tokens\.subList\(0, Constants\.MAX_TEXT_LEN - 1\)\.toMutableList\(\)\.also \{\n'
              r'                it\.add\(Constants\.EOT_TEXT\)\n'
              r'            \}\n'
              r'        \} else \{\n'
              r'            tokens\n'
              r'        \}\n\n'
              r'        return result\.toIntArray\(\)'
          )
          text, count = re.subn(pattern, new_truncation, text, count=1)
          if count != 1:
              raise SystemExit("Could not fix tokenizer sequence-marker handling")
          tokenizer.write_text(text)

          # Add a safe ZIP importer for precomputed Chatterbox conditioning tensors.
          vm = Path("app/src/main/java/com/acul3/chatterboxtts/tts/TTSViewModel.kt")
          text = vm.read_text()
          text = replace_once(
              text,
              'import android.content.Context',
              'import android.content.Context\nimport android.net.Uri',
              "ViewModel Android imports"
          )
          text = replace_once(
              text,
              'import java.io.File',
              'import java.io.File\nimport java.io.FileOutputStream\nimport java.util.zip.ZipInputStream',
              "ViewModel IO imports"
          )
          text = replace_once(
              text,
              '    val modelStatus: String = "Models not loaded. Will download on first generation (~2.6GB)."',
              '    val modelStatus: String = "Models not loaded. First generation downloads several GB of model files."',
              "download size notice"
          )
          text = replace_once(
              text,
              '    val modelStatus: String = "Models not loaded. First generation downloads several GB of model files."',
              '    val modelStatus: String = "Models not loaded. First generation downloads several GB of model files.",\n'
              '    val voiceProfileStatus: String = "Bundled default voice"',
              "voice profile state"
          )
          methods = '''    suspend fun importVoiceProfile(context: Context, uri: Uri) {
                  if (_state.value.isGenerating) return
                  _state.update { it.copy(progressMessage = "Validating voice profile ZIP...", error = null) }
                  val importDir = File(context.filesDir, ".voice-profile-import")
                  try {
                      withContext(Dispatchers.IO) {
                          importDir.deleteRecursively()
                          check(importDir.mkdirs() || importDir.isDirectory) { "Could not create import folder" }
                          val expectedSizes = mapOf(
                              "speaker_emb.bin" to 1024L,
                              "cond_speech_tokens.bin" to 600L,
                              "emotion_adv.bin" to 4L,
                              "prompt_tokens.bin" to 300L,
                              "prompt_token_len.bin" to 4L,
                              "xvector.bin" to 768L,
                              "prompt_mel.bin" to 100480L
                          )
                          val imported = mutableSetOf<String>()
                          val raw = context.contentResolver.openInputStream(uri)
                              ?: throw IllegalArgumentException("Cannot open selected ZIP")
                          raw.use { input ->
                              ZipInputStream(input).use { zip ->
                                  var entry = zip.nextEntry
                                  while (entry != null) {
                                      val leaf = entry.name.substringAfterLast('/')
                                      val name = if (leaf == "cond_prompt_speech_tokens.bin") {
                                          "cond_speech_tokens.bin"
                                      } else {
                                          leaf
                                      }
                                      val expected = expectedSizes[name]
                                      if (!entry.isDirectory && expected != null) {
                                          require(imported.add(name)) { "Duplicate file in ZIP: " + name }
                                          val outputFile = File(importDir, name)
                                          var copied = 0L
                                          FileOutputStream(outputFile).use { output ->
                                              val buffer = ByteArray(4096)
                                              while (true) {
                                                  val count = zip.read(buffer)
                                                  if (count < 0) break
                                                  copied += count
                                                  require(copied <= expected) { name + " is larger than expected" }
                                                  output.write(buffer, 0, count)
                                              }
                                          }
                                          require(copied == expected) {
                                              name + " must be " + expected + " bytes; found " + copied
                                          }
                                      }
                                      zip.closeEntry()
                                      entry = zip.nextEntry
                                  }
                              }
                          }
                          val required = setOf(
                              "speaker_emb.bin",
                              "cond_speech_tokens.bin",
                              "prompt_tokens.bin",
                              "prompt_token_len.bin",
                              "xvector.bin",
                              "prompt_mel.bin"
                          )
                          require(imported.containsAll(required)) {
                              "ZIP is missing required voice tensors: " + (required - imported)
                          }
                          if (!imported.contains("emotion_adv.bin")) {
                              context.assets.open("emotion_adv.bin").use { source ->
                                  FileOutputStream(File(importDir, "emotion_adv.bin")).use { target ->
                                      source.copyTo(target)
                                  }
                              }
                          }
                          val destination = File(context.filesDir, "voice-profile")
                          val backup = File(context.filesDir, ".voice-profile-backup")
                          backup.deleteRecursively()
                          if (destination.exists()) {
                              check(destination.renameTo(backup)) { "Could not back up the current profile" }
                          }
                          if (!importDir.renameTo(destination)) {
                              if (backup.exists()) backup.renameTo(destination)
                              error("Could not save imported profile")
                          }
                          backup.deleteRecursively()
                      }
                      ttsEngine?.close()
                      ttsEngine = null
                      audioPlayer?.stop()
                      audioPlayer?.release()
                      audioPlayer = null
                      lastAudioData = null
                      _state.update {
                          it.copy(
                              progress = 0f,
                              progressMessage = "Custom voice profile imported. Generate speech to use it.",
                              error = null,
                              audioReady = false,
                              isPlaying = false,
                              voiceProfileStatus = "Custom voice profile imported"
                          )
                      }
                  } catch (e: Exception) {
                      importDir.deleteRecursively()
                      _state.update {
                          it.copy(progressMessage = "", error = "Profile import failed: " + e.message)
                      }
                  }
              }

              fun useDefaultVoice(context: Context) {
                  if (_state.value.isGenerating) return
                  File(context.filesDir, "voice-profile").deleteRecursively()
                  ttsEngine?.close()
                  ttsEngine = null
                  audioPlayer?.stop()
                  audioPlayer?.release()
                  audioPlayer = null
                  lastAudioData = null
                  _state.update {
                      it.copy(
                          audioReady = false,
                          isPlaying = false,
                          error = null,
                          progressMessage = "Bundled default voice selected. Generate speech to use it.",
                          voiceProfileStatus = "Bundled default voice"
                      )
                  }
              }

              suspend fun generate(context: Context) {'''
          text = replace_once(
              text,
              '    suspend fun generate(context: Context) {',
              methods,
              "voice profile ViewModel methods"
          )
          vm.write_text(text)

          print("Generated ARM64-only Chatterbox Playtest sources and voice-profile support.")
          PY

          # Runtime hardening: mmap large models and preserve ExecuTorch native diagnostics.
          cat > app/src/main/java/com/acul3/chatterboxtts/models/PteModel.kt <<'KOTLIN'
          package com.acul3.chatterboxtts.models

          import android.util.Log
          import org.pytorch.executorch.EValue
          import org.pytorch.executorch.Module
          import org.pytorch.executorch.Tensor
          import java.io.File

          /** Memory-mapped ExecuTorch model wrapper with actionable runtime errors. */
          class PteModel(private val modelPath: String) {
              companion object {
                  private const val TAG = "PteModel"
              }

              private var module: Module? = null

              fun load() {
                  val file = File(modelPath)
                  require(file.isFile && file.length() > 0L) {
                      "Model file is missing or empty: $modelPath"
                  }
                  Log.i(TAG, "Memory-mapping model: $modelPath (" + file.length() + " bytes)")
                  module = Module.load(modelPath, Module.LOAD_MODE_MMAP)
                  Log.i(TAG, "Model loaded: $modelPath")
              }

              fun isLoaded(): Boolean = module != null

              fun forward(vararg inputs: EValue): Array<EValue> {
                  val mod = module ?: throw IllegalStateException("Model not loaded: " + modelPath)
                  val inputSummary = inputs.mapIndexed { index, input ->
                      if (input.isTensor()) {
                          val tensor = input.toTensor()
                          "input[" + index + "] shape=" + tensor.shape().contentToString() +
                              " dtype=" + tensor.dtype() + " elements=" + tensor.numel()
                      } else {
                          "input[" + index + "] non-tensor"
                      }
                  }.joinToString("; ")
                  try {
                      return mod.forward(*inputs)
                  } catch (e: Exception) {
                      val nativeLogs = mutableListOf<String>()
                      try {
                          mod.readLogBuffer().forEach { nativeLogs.add(it) }
                      } catch (logError: Exception) {
                          Log.w(TAG, "Could not read ExecuTorch module log buffer", logError)
                      }
                      try {
                          Module.readLogBufferStatic().forEach { nativeLogs.add(it) }
                      } catch (logError: Exception) {
                          Log.w(TAG, "Could not read ExecuTorch global log buffer", logError)
                      }
                      val nativeLog = nativeLogs.distinct().takeLast(24).joinToString("\n")
                      val detail = if (nativeLog.isBlank()) "" else "\nExecuTorch native log:\n" + nativeLog
                      val message = "ExecuTorch forward failed for " + File(modelPath).name +
                          "; " + inputSummary + "; cause=" + e.javaClass.simpleName +
                          ": " + (e.message ?: "<no message>") + detail
                      Log.e(TAG, message, e)
                      throw RuntimeException(message, e)
                  }
              }

              fun forwardSingleTensor(vararg inputs: EValue): Tensor {
                  val outputs = forward(*inputs)
                  require(outputs.isNotEmpty()) { "Model returned no outputs: $modelPath" }
                  return outputs[0].toTensor()
              }

              fun close() {
                  module?.destroy()
                  module = null
              }
          }
          KOTLIN

          # The prefill exporter flattens K/V per layer as K0,V0,K1,V1,... .
          cat > app/src/main/java/com/acul3/chatterboxtts/models/T3KvCacheLayout.kt <<'KOTLIN'
          package com.acul3.chatterboxtts.models

          /** Pure helpers for the exact interleaved layout emitted by export_t3_prefill_v2.py. */
          object T3KvCacheLayout {
              fun splitInterleavedFloat(
                  data: FloatArray,
                  layers: Int,
                  elementsPerLayer: Int
              ): Pair<FloatArray, FloatArray> {
                  require(layers > 0 && elementsPerLayer > 0) { "KV dimensions must be positive" }
                  val layerPairSize = Math.multiplyExact(elementsPerLayer, 2)
                  val expected = Math.multiplyExact(layers, layerPairSize)
                  require(data.size == expected) {
                      "Interleaved FP32 KV size mismatch: expected " + expected + ", got " + data.size
                  }
                  val keys = FloatArray(layers * elementsPerLayer)
                  val values = FloatArray(layers * elementsPerLayer)
                  for (layer in 0 until layers) {
                      val source = layer * layerPairSize
                      val target = layer * elementsPerLayer
                      data.copyInto(keys, target, source, source + elementsPerLayer)
                      data.copyInto(values, target, source + elementsPerLayer, source + layerPairSize)
                  }
                  return keys to values
              }

              fun splitInterleavedHalf(
                  data: ShortArray,
                  layers: Int,
                  elementsPerLayer: Int
              ): Pair<ShortArray, ShortArray> {
                  require(layers > 0 && elementsPerLayer > 0) { "KV dimensions must be positive" }
                  val layerPairSize = Math.multiplyExact(elementsPerLayer, 2)
                  val expected = Math.multiplyExact(layers, layerPairSize)
                  require(data.size == expected) {
                      "Interleaved FP16 KV size mismatch: expected " + expected + ", got " + data.size
                  }
                  val keys = ShortArray(layers * elementsPerLayer)
                  val values = ShortArray(layers * elementsPerLayer)
                  for (layer in 0 until layers) {
                      val source = layer * layerPairSize
                      val target = layer * elementsPerLayer
                      data.copyInto(keys, target, source, source + elementsPerLayer)
                      data.copyInto(values, target, source + elementsPerLayer, source + layerPairSize)
                  }
                  return keys to values
              }
          }
          KOTLIN

          cat > app/src/main/java/com/acul3/chatterboxtts/models/T3Decoder.kt <<'KOTLIN'
          package com.acul3.chatterboxtts.models

          import android.util.Half
          import android.util.Log
          import com.acul3.chatterboxtts.tts.Constants
          import com.acul3.chatterboxtts.tts.SpeechSampler
          import org.pytorch.executorch.DType
          import org.pytorch.executorch.EValue
          import org.pytorch.executorch.Tensor

          /**
           * T3 V4 prefill + autoregressive decode.
           * The validated PTE revision uses FP32 conditioning/KV and INT32 token inputs.
           * The decoder deinterleaves the per-layer K/V cache exactly as exported.
           */
          class T3Decoder(
              private val prefillModel: PteModel,
              private val decodeModel: PteModel
          ) {
              companion object {
                  private const val TAG = "T3Decoder"
                  private const val KV_LAYER_ELEMENTS =
                      Constants.N_HEADS * Constants.MAX_KV_LEN * Constants.HEAD_DIM
                  private const val KV_FLAT_ELEMENTS =
                      Constants.N_LAYERS * 2 * KV_LAYER_ELEMENTS
                  private val KV_SHAPE = longArrayOf(
                      Constants.N_LAYERS.toLong(), 1L, Constants.N_HEADS.toLong(),
                      Constants.MAX_KV_LEN.toLong(), Constants.HEAD_DIM.toLong()
                  )
                  private val KV_FLAT_SHAPE = longArrayOf(KV_FLAT_ELEMENTS.toLong())
                  private val COND_SHAPE = longArrayOf(1L, Constants.COND_LEN.toLong(), 1024L)
                  private val TEXT_SHAPE = longArrayOf(1L, Constants.TEXT_SEQ_LEN.toLong())
              }

              fun decode(
                  condEmbedding: Tensor,
                  textTokens: Tensor,
                  onProgress: (Float, String) -> Unit = { _, _ -> }
              ): LongArray {
                  require(condEmbedding.shape().contentEquals(COND_SHAPE)) {
                      "T3 conditioning shape mismatch: expected " + COND_SHAPE.contentToString() +
                          ", got " + condEmbedding.shape().contentToString()
                  }
                  require(condEmbedding.dtype() == DType.FLOAT) {
                      "T3 conditioning must be FP32, got " + condEmbedding.dtype()
                  }
                  require(textTokens.shape().contentEquals(TEXT_SHAPE)) {
                      "T3 text shape mismatch: expected " + TEXT_SHAPE.contentToString() +
                          ", got " + textTokens.shape().contentToString()
                  }
                  require(textTokens.dtype() == DType.INT32) {
                      "T3 text tokens must be INT32, got " + textTokens.dtype()
                  }

                  Log.i(TAG, "T3 prefill input: cond=" + describe(condEmbedding) + ", text=" + describe(textTokens))
                  onProgress(0f, "Running T3 prefill...")
                  val prefillOutputs = runPrefill(condEmbedding, textTokens)
                  require(prefillOutputs.size >= 2) {
                      "T3 prefill returned " + prefillOutputs.size + " outputs; expected logits and KV cache"
                  }

                  var currentLogits = prefillOutputs[0].toTensor()
                  val kvFlat = prefillOutputs[1].toTensor()
                  require(currentLogits.numel() == Constants.SPEECH_VOCAB.toLong()) {
                      "T3 prefill logits have unexpected shape " + currentLogits.shape().contentToString()
                  }
                  require(kvFlat.shape().contentEquals(KV_FLAT_SHAPE)) {
                      "T3 prefill KV shape mismatch: expected " + KV_FLAT_SHAPE.contentToString() +
                          ", got " + kvFlat.shape().contentToString()
                  }
                  require(currentLogits.dtype() == kvFlat.dtype()) {
                      "T3 prefill logits/KV dtype mismatch: " + currentLogits.dtype() + " vs " + kvFlat.dtype()
                  }

                  val kvPair = when (kvFlat.dtype()) {
                      DType.HALF -> {
                          val split = T3KvCacheLayout.splitInterleavedHalf(
                              kvFlat.dataAsShortArray, Constants.N_LAYERS, KV_LAYER_ELEMENTS
                          )
                          Tensor.fromBlob(split.first, KV_SHAPE) to Tensor.fromBlob(split.second, KV_SHAPE)
                      }
                      DType.FLOAT -> {
                          val split = T3KvCacheLayout.splitInterleavedFloat(
                              kvFlat.dataAsFloatArray, Constants.N_LAYERS, KV_LAYER_ELEMENTS
                          )
                          Tensor.fromBlob(split.first, KV_SHAPE) to Tensor.fromBlob(split.second, KV_SHAPE)
                      }
                      else -> throw IllegalStateException("Unsupported T3 KV dtype: " + kvFlat.dtype())
                  }
                  var kvK = kvPair.first
                  var kvV = kvPair.second

                  Log.i(TAG, "T3 prefill outputs: logits=" + describe(currentLogits) + ", KV=" + describe(kvFlat))
                  onProgress(0.05f, "Prefill complete. Decoding speech tokens...")

                  val speechTokens = ArrayList<Long>()
                  for (step in 0 until Constants.MAX_DECODE_STEPS) {
                      require(currentLogits.numel() == Constants.SPEECH_VOCAB.toLong()) {
                          "T3 decode logits shape changed at step " + step + ": " +
                              currentLogits.shape().contentToString()
                      }
                      val logitsData = logitsAsFloat(currentLogits, step)
                      require(logitsData.size == Constants.SPEECH_VOCAB) {
                          "T3 decode logits length mismatch at step " + step + ": " + logitsData.size
                      }
                      val token = SpeechSampler.sampleToken(
                          logits = logitsData,
                          previousTokens = speechTokens.map { it.toInt() }
                      )
                      require(token in 0 until Constants.SPEECH_VOCAB) {
                          "T3 sampler returned out-of-range token " + token
                      }
                      if (token == Constants.EOT_SPEECH) {
                          Log.i(TAG, "T3 EOS token at step " + step + "; generated " + speechTokens.size + " tokens")
                          break
                      }
                      speechTokens.add(token.toLong())

                      if (step % 50 == 0) {
                          onProgress(
                              0.05f + (step.toFloat() / Constants.MAX_DECODE_STEPS) * 0.95f,
                              "Decode step " + step + ": " + speechTokens.size + " tokens generated"
                          )
                      }

                      val tokenTensor = Tensor.fromBlob(intArrayOf(token), longArrayOf(1L, 1L))
                      val stepTensor = Tensor.fromBlob(intArrayOf(step), longArrayOf())
                      val decodeOutputs = try {
                          decodeModel.forward(
                              EValue.from(tokenTensor),
                              EValue.from(stepTensor),
                              EValue.from(kvK),
                              EValue.from(kvV)
                          )
                      } catch (e: Exception) {
                          throw RuntimeException(
                              "T3 decode failed at step " + step + "; token=" + token +
                                  ", KV dtype=" + kvK.dtype() + ", K=" + kvK.shape().contentToString() +
                                  ", V=" + kvV.shape().contentToString() + ": " + e.message,
                              e
                          )
                      }
                      require(decodeOutputs.size >= 3) {
                          "T3 decode returned " + decodeOutputs.size + " outputs at step " + step +
                              "; expected logits, K and V"
                      }
                      currentLogits = decodeOutputs[0].toTensor()
                      val nextK = decodeOutputs[1].toTensor()
                      val nextV = decodeOutputs[2].toTensor()
                      require(nextK.shape().contentEquals(KV_SHAPE) && nextV.shape().contentEquals(KV_SHAPE)) {
                          "T3 decode KV shape mismatch at step " + step +
                              ": K=" + nextK.shape().contentToString() +
                              ", V=" + nextV.shape().contentToString()
                      }
                      require(nextK.dtype() == kvFlat.dtype() && nextV.dtype() == kvFlat.dtype()) {
                          "T3 decode KV dtype changed at step " + step + ": expected " + kvFlat.dtype() +
                              ", got " + nextK.dtype() + "/" + nextV.dtype()
                      }
                      kvK = nextK
                      kvV = nextV
                  }

                  require(speechTokens.isNotEmpty()) {
                      "T3 generated no speech tokens. Check model revision, text tokens and PTE export compatibility."
                  }
                  Log.i(TAG, "T3 decode complete: " + speechTokens.size + " speech tokens")
                  onProgress(1f, "Generated " + speechTokens.size + " speech tokens")
                  return speechTokens.toLongArray()
              }

              private fun runPrefill(condEmbedding: Tensor, textTokens: Tensor): Array<EValue> {
                  require(condEmbedding.shape().contentEquals(COND_SHAPE) &&
                      condEmbedding.dtype() == DType.FLOAT) {
                      "T3 prefill requires FP32 cond_emb [1,34,1024]: " + describe(condEmbedding)
                  }
                  require(textTokens.shape().contentEquals(TEXT_SHAPE) &&
                      textTokens.dtype() == DType.INT32) {
                      "T3 prefill requires INT32 text_tokens [1,258]: " + describe(textTokens)
                  }

                  Log.i(
                      TAG,
                      "Calling validated T3 prefill signature: cond=" +
                          describe(condEmbedding) + ", text=" + describe(textTokens) +
                          ", modelRevision=" + Constants.MODEL_REVISION
                  )
                  try {
                      val outputs = prefillModel.forward(
                          EValue.from(condEmbedding),
                          EValue.from(textTokens)
                      )
                      require(outputs.size == 2) {
                          "T3 prefill should return exactly 2 outputs (logits, flat KV); got " +
                              outputs.size
                      }
                      val logits = outputs[0].toTensor()
                      val kv = outputs[1].toTensor()
                      require(logits.dtype() == DType.FLOAT && kv.dtype() == DType.FLOAT) {
                          "Validated T3 prefill export must return FP32 logits and FP32 KV; got logits=" +
                              logits.dtype() + ", KV=" + kv.dtype()
                      }
                      Log.i(
                          TAG,
                          "T3 prefill completed: logits=" + describe(logits) +
                              ", KV=" + describe(kv)
                      )
                      return outputs
                  } catch (e: Exception) {
                      val message = "T3 prefill failed for the validated FP32/INT32 PTE contract. " +
                          "Model revision=" + Constants.MODEL_REVISION +
                          "; conditioning=" + describe(condEmbedding) +
                          "; text=" + describe(textTokens) +
                          "; underlying ExecuTorch failure=" + errorChain(e)
                      Log.e(TAG, message, e)
                      throw RuntimeException(message, e)
                  }
              }

              private fun logitsAsFloat(tensor: Tensor, step: Int): FloatArray {
                  return when (tensor.dtype()) {
                      DType.FLOAT -> tensor.dataAsFloatArray
                      DType.HALF -> {
                          val halfValues = tensor.dataAsShortArray
                          FloatArray(halfValues.size) { index -> Half.toFloat(halfValues[index]) }
                      }
                      else -> throw IllegalStateException(
                          "T3 logits have unsupported dtype at step " + step + ": " + tensor.dtype()
                      )
                  }
              }

              private fun errorChain(error: Throwable): String {
                  val messages = mutableListOf<String>()
                  var current: Throwable? = error
                  while (current != null && messages.size < 8) {
                      messages.add(
                          current.javaClass.simpleName + ": " +
                              (current.message ?: "<no message>")
                      )
                      current = current.cause
                  }
                  return messages.joinToString(" -> ")
              }

              private fun describe(tensor: Tensor): String =
                  "shape=" + tensor.shape().contentToString() + ", dtype=" + tensor.dtype() +
                      ", elements=" + tensor.numel()

              fun close() {
                  prefillModel.close()
                  decodeModel.close()
              }
          }
          KOTLIN

          # Replace the upstream placeholder with the actual multilingual tokenizer vocabulary.
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            "https://huggingface.co/ResembleAI/chatterbox/resolve/main/grapheme_mtl_merged_expanded_v1.json" \
            --output app/src/main/assets/grapheme_mtl_merged_expanded_v1.json

          # Guard against silent patch drift.
          grep -q 'abiFilters += listOf("arm64-v8a")' app/build.gradle.kts
          ! grep -q 'x86_64' app/build.gradle.kts
          grep -q '"hi" to "Hindi"' app/src/main/java/com/acul3/chatterboxtts/ui/MainScreen.kt
          grep -q 'fun importVoiceProfile' app/src/main/java/com/acul3/chatterboxtts/tts/TTSViewModel.kt
          grep -q 'private fun conditioningBytes' app/src/main/java/com/acul3/chatterboxtts/models/VocoderPipeline.kt
          grep -q 'executorch = "1.1.0"' gradle/libs.versions.toml
          grep -q 'applicationId = "com.sun1423.playtest.v2"' app/build.gradle.kts
          grep -q 'storeType = "PKCS12"' app/build.gradle.kts
          grep -q 'MODEL_SHA256' app/src/main/java/com/acul3/chatterboxtts/tts/Constants.kt
          grep -q 'MODEL_SIZES' app/src/main/java/com/acul3/chatterboxtts/tts/Constants.kt
          test -s app/src/main/assets/grapheme_mtl_merged_expanded_v1.json
          grep -q 'readLogBufferStatic' app/src/main/java/com/acul3/chatterboxtts/models/PteModel.kt

      - name: Harden model cache, sampler, lifecycle and vocoder
        working-directory: /tmp/chatterbox-android
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/java/com/acul3/chatterboxtts/tts/ModelManager.kt <<'KOTLIN'
          package com.acul3.chatterboxtts.tts

          import android.content.Context
          import android.util.Log
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import java.io.File
          import java.io.FileOutputStream
          import java.security.MessageDigest
          import java.util.concurrent.TimeUnit

          /** Accepts a cached model only when size and SHA-256 match the pinned Hub revision. */
          class ModelManager(private val context: Context) {
              companion object {
                  private const val TAG = "ModelManager"
                  private const val MODELS_DIR = "models"
                  private const val REVISION_FILE = ".model_revision"
              }

              private val client = OkHttpClient.Builder()
                  .connectTimeout(30, TimeUnit.SECONDS)
                  .readTimeout(120, TimeUnit.SECONDS)
                  .followRedirects(true)
                  .build()

              private val modelsDir: File by lazy {
                  File(context.filesDir, MODELS_DIR).also { it.mkdirs() }
              }
              private val revisionFile: File by lazy { File(modelsDir, REVISION_FILE) }
              private val verifiedFiles = mutableMapOf<String, Pair<Long, Long>>()

              fun getModelPath(filename: String): String {
                  require(filename in Constants.MODEL_FILES) { "Unknown model filename: " + filename }
                  return File(modelsDir, filename).absolutePath
              }

              private fun sha256(file: File): String {
                  val digest = MessageDigest.getInstance("SHA-256")
                  file.inputStream().buffered().use { input ->
                      val buffer = ByteArray(1024 * 1024)
                      while (true) {
                          val count = input.read(buffer)
                          if (count < 0) break
                          digest.update(buffer, 0, count)
                      }
                  }
                  return digest.digest().joinToString("") { "%02x".format(it) }
              }

              private fun modelFileValid(name: String): Boolean {
                  val file = File(modelsDir, name)
                  val expectedSize = Constants.MODEL_SIZES[name] ?: return false
                  val expectedSha = Constants.MODEL_SHA256[name] ?: return false
                  if (!file.isFile || file.length() != expectedSize) {
                      verifiedFiles.remove(name)
                      return false
                  }
                  val currentStat = Pair(file.length(), file.lastModified())
                  if (verifiedFiles[name] == currentStat) return true
                  return try {
                      val valid = sha256(file) == expectedSha
                      if (valid) verifiedFiles[name] = currentStat else verifiedFiles.remove(name)
                      valid
                  } catch (e: Exception) {
                      Log.w(TAG, "Could not verify cached model " + name, e)
                      false
                  }
              }

              fun allModelsReady(): Boolean {
                  val valid = Constants.MODEL_FILES.all { modelFileValid(it) }
                  if (!valid) return false
                  val recordedRevision = if (revisionFile.isFile) revisionFile.readText().trim() else ""
                  if (recordedRevision != Constants.MODEL_REVISION) {
                      // Reuse a previous several-GB cache only if every file matches this exact
                      // model snapshot's immutable size and SHA-256.
                      revisionFile.writeText(Constants.MODEL_REVISION)
                      Log.i(TAG, "Verified complete cached models for revision " + Constants.MODEL_REVISION)
                  }
                  return true
              }

              suspend fun ensureModelsDownloaded(onProgress: (Float, String) -> Unit) =
                  withContext(Dispatchers.IO) {
                      val total = Constants.MODEL_FILES.size
                      var completed = 0
                      for (name in Constants.MODEL_FILES) {
                          if (modelFileValid(name)) {
                              completed++
                              onProgress(
                                  completed.toFloat() / total,
                                  "Verified cached model " + name + " (" + completed + "/" + total + ")"
                              )
                              continue
                          }

                          val target = File(modelsDir, name)
                          verifiedFiles.remove(name)
                          target.delete()
                          File(modelsDir, name + ".tmp").delete()
                          val expectedSize = Constants.MODEL_SIZES[name]
                              ?: throw IllegalStateException("Missing expected size for " + name)
                          val expectedSha = Constants.MODEL_SHA256[name]
                              ?: throw IllegalStateException("Missing expected SHA-256 for " + name)
                          val url = Constants.HF_REPO_BASE + "/" + name
                          onProgress(completed.toFloat() / total, "Downloading " + name + " (" + (completed + 1) + "/" + total + ")")
                          downloadFile(url, target, expectedSize, expectedSha) { received, size ->
                              val perFile = (received.toDouble() / size.toDouble()).toFloat().coerceIn(0f, 1f)
                              onProgress(
                                  (completed + perFile) / total,
                                  "Downloading " + name + ": " + (received / (1024 * 1024)) +
                                      " / " + (size / (1024 * 1024)) + " MB"
                              )
                          }
                          completed++
                          Log.i(TAG, "Downloaded and verified " + name + " (" + target.length() + " bytes)")
                      }

                      check(Constants.MODEL_FILES.all { modelFileValid(it) }) {
                          "One or more PTE models failed final SHA-256 validation"
                      }
                      revisionFile.writeText(Constants.MODEL_REVISION)
                      onProgress(1f, "All seven models verified for revision " + Constants.MODEL_REVISION.take(10))
                  }

              private fun downloadFile(
                  url: String,
                  target: File,
                  expectedSize: Long,
                  expectedSha: String,
                  onProgress: (Long, Long) -> Unit
              ) {
                  val temp = File(modelsDir, target.name + ".tmp")
                  temp.delete()
                  try {
                      val request = Request.Builder().url(url).build()
                      client.newCall(request).execute().use { response ->
                          if (!response.isSuccessful) {
                              throw IllegalStateException("HTTP " + response.code + ": " + response.message)
                          }
                          val body = response.body ?: throw IllegalStateException("Empty model response")
                          val contentLength = body.contentLength()
                          if (contentLength >= 0L && contentLength != expectedSize) {
                              throw IllegalStateException(
                                  "Server length mismatch for " + target.name + ": expected " +
                                      expectedSize + ", got " + contentLength
                              )
                          }
                          var received = 0L
                          body.byteStream().use { input ->
                              FileOutputStream(temp).use { output ->
                                  val buffer = ByteArray(1024 * 1024)
                                  while (true) {
                                      val count = input.read(buffer)
                                      if (count < 0) break
                                      output.write(buffer, 0, count)
                                      received += count
                                      onProgress(received, expectedSize)
                                  }
                                  output.flush()
                                  output.fd.sync()
                              }
                          }
                          require(received == expectedSize) {
                              "Truncated model " + target.name + ": expected " + expectedSize +
                                  ", received " + received
                          }
                      }
                      val actualSha = sha256(temp)
                      require(actualSha == expectedSha) {
                          "SHA-256 mismatch for " + target.name + ": expected " + expectedSha +
                              ", got " + actualSha
                      }
                      if (target.exists()) require(target.delete()) { "Cannot replace old model " + target.name }
                      require(temp.renameTo(target)) { "Cannot finalize downloaded model " + target.name }
                      require(target.isFile && target.length() == expectedSize) {
                          "Final file size mismatch for " + target.name
                      }
                      verifiedFiles[target.name] = Pair(target.length(), target.lastModified())
                  } finally {
                      if (temp.exists()) temp.delete()
                  }
              }
          }
          KOTLIN

          cat > app/src/main/java/com/acul3/chatterboxtts/tts/SpeechSampler.kt <<'KOTLIN'
          package com.acul3.chatterboxtts.tts

          import kotlin.math.exp
          import kotlin.random.Random

          /** Numerically stable min-p/top-p sampler; rejects invalid logits instead of returning token zero. */
          object SpeechSampler {
              fun sampleToken(
                  logits: FloatArray,
                  temperature: Float = Constants.DEFAULT_TEMPERATURE,
                  topP: Float = Constants.DEFAULT_TOP_P,
                  minP: Float = Constants.DEFAULT_MIN_P,
                  repPenalty: Float = Constants.DEFAULT_REP_PENALTY,
                  previousTokens: List<Int> = emptyList()
              ): Int {
                  require(logits.isNotEmpty()) { "Cannot sample from empty logits" }
                  require(temperature.isFinite() && temperature > 0f) { "Temperature must be finite and positive" }
                  require(topP.isFinite() && topP > 0f && topP <= 1f) { "topP must be in (0, 1]" }
                  require(minP.isFinite() && minP >= 0f && minP <= 1f) { "minP must be in [0, 1]" }
                  require(repPenalty.isFinite() && repPenalty > 0f) { "Repetition penalty must be finite and positive" }
                  require(logits.all { it.isFinite() }) { "T3 logits contain NaN or infinite values" }

                  val adjusted = logits.copyOf()
                  if (repPenalty != 1f) {
                      for (id in previousTokens.toSet()) {
                          if (id in adjusted.indices) {
                              adjusted[id] = if (adjusted[id] > 0f) adjusted[id] / repPenalty else adjusted[id] * repPenalty
                          }
                      }
                  }
                  for (index in adjusted.indices) adjusted[index] /= temperature
                  val maxLogit = adjusted.maxOrNull() ?: throw IllegalArgumentException("No logits")
                  val expValues = DoubleArray(adjusted.size) { index ->
                      exp((adjusted[index] - maxLogit).toDouble())
                  }
                  val sum = expValues.sum()
                  require(sum.isFinite() && sum > 0.0) { "T3 softmax probability sum is invalid" }
                  val maxProb = (expValues.maxOrNull() ?: 0.0) / sum
                  val threshold = maxProb * minP.toDouble()
                  val ordered = expValues.indices
                      .map { it to (expValues[it] / sum) }
                      .filter { it.second >= threshold && it.second > 0.0 }
                      .sortedByDescending { it.second }
                  require(ordered.isNotEmpty()) { "T3 filters removed all candidate tokens" }

                  val kept = ArrayList<Pair<Int, Double>>()
                  var cumulative = 0.0
                  for (candidate in ordered) {
                      kept.add(candidate)
                      cumulative += candidate.second
                      if (cumulative >= topP.toDouble()) break
                  }
                  val total = kept.sumOf { it.second }
                  require(total.isFinite() && total > 0.0) { "T3 candidate distribution is empty" }
                  val target = Random.nextDouble() * total
                  var cursor = 0.0
                  for ((id, probability) in kept) {
                      cursor += probability
                      if (cursor >= target) return id
                  }
                  return kept.last().first
              }
          }
