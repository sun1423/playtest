name: Pocket TTS Hindi integration checks

on:
  push:
    branches:
      - feature/pocket-tts-hindi-voiceover
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend and run voice workflow tests
        run: |
          python -m py_compile app.py pocket_tts.py voice_profile.py voice_reference.py tests/test_pocket_tts.py tests/test_voice_profile.py tests/test_voice_reference.py
          python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
